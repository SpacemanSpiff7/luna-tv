name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Without a persistent keystore, every CI run signs with a freshly
      # generated debug key, so each release has a different signature and
      # updating over an installed copy fails with "App not installed".
      - name: Restore persistent debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Persistent debug keystore restored."
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set — APK will be signed with a throwaway key and in-app updates will fail. See README 'Release signing'."
          fi

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luna-tv-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Luna TV v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
